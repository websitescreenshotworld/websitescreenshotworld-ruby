# Version updates: the workflow pins every action to a commit, with the version in a comment, and Dependabot
# moves both together. Dependencies come grouped into one pull request a month. The spec submodule is left alone:
# move its pin by hand when the API changes, so the tests and the code change together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: monthly
    groups:
      ruby:
        patterns: ["*"]
