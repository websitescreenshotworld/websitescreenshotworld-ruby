name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read


jobs:
  test:
    name: Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # spec/ is the websitescreenshotworld-spec submodule: the shared cases and the conformance server.
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Lint
        run: bundle exec rubocop
      - name: Test
        run: bundle exec rake test

  publish:
    name: Publish to RubyGems
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      id-token: write # RubyGems trusted publishing; no API key is stored.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Check the tag matches the gem version
        run: |
          version=$(ruby -Ilib -r websitescreenshotworld/version -e 'print WebsiteScreenshotWorld::VERSION')
          test "${GITHUB_REF_NAME#v}" = "$version"
      # Trusted publishing: exchange the workflow's OIDC token for a RubyGems API key that lasts 15 minutes.
      # Done by hand because rubygems/configure-rubygems-credentials (v2.1.0) cannot pass `owner`, and RubyGems.org
      # only lets a pending trusted publisher create a new gem when the exchange names the account that will own it
      # (its ID is on that account's Pending Trusted Publishers page). Once the gem exists the owner is not needed,
      # but sending it does no harm. RUBYGEMS_OWNER_ID is a repository variable, not a secret: the ID is public.
      - name: Get a RubyGems API key (trusted publishing)
        env:
          RUBYGEMS_OWNER_ID: ${{ vars.RUBYGEMS_OWNER_ID }}
        run: |
          set -euo pipefail
          jwt=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=rubygems.org" | jq -r .value)
          echo "::add-mask::${jwt}"
          body=$(jq -n --arg jwt "$jwt" --arg owner "${RUBYGEMS_OWNER_ID:-}" \
            '{jwt: $jwt} + (if $owner == "" then {} else {owner: $owner} end)')
          key=$(curl -sS --fail-with-body -X POST -H "Content-Type: application/json" -H "Accept: application/json" \
            --data "$body" https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token | jq -r .rubygems_api_key)
          test -n "$key" && test "$key" != "null"
          echo "::add-mask::${key}"
          echo "GEM_HOST_API_KEY=${key}" >> "$GITHUB_ENV"
      # Build and push directly. `rake release` (what rubygems/release-gem runs) also creates and pushes a git tag,
      # which a tag-triggered run with a read-only token cannot do - and the tag already exists.
      - name: Build the gem
        run: gem build websitescreenshotworld.gemspec
      - name: Push to RubyGems
        run: gem push "websitescreenshotworld-${GITHUB_REF_NAME#v}.gem"
